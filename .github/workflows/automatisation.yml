name: Mise a jour du calendrier d'animes

on:
  schedule:
    # Ce code bizarre signifie : "Se lancer tous les jours à 04h00 du matin"
    - cron: '0 4 * * *'
  workflow_dispatch: # Permet aussi de lancer le robot manuellement si besoin

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Donne le droit au robot d'enregistrer le fichier .ics

    steps:
    - name: Récupérer le code du projet
      uses: actions/checkout@v4

    - name: Installer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Installer les outils requis
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lancer le script de calcul
      run: python calcul_animes.py

    - name: Enregistrer les modifications sur GitHub
      run: |
        git config --global user.name 'Robot Calendrier'
        git config --global user.email 'robot@github.com'
        git add fin_animes_planning_proton.ics
        git commit -m "Mise à jour automatique du calendrier" || exit 0
        git push
